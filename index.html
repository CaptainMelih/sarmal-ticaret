<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/sarmalticaretlogo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarmal Ticaret | Güvenli Alışverişin Adresi</title>
  <style>
    #initial-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      transition: opacity 0.5s ease;
    }
    .splash-logo-box {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-img {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }
    .splash-spinner {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-right-color: #a855f7;
      border-radius: 50%;
      animation: splashSpin 1s linear infinite;
    }
    @keyframes splashSpin {
      100% { transform: rotate(360deg); }
    }
    .splash-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    .splash-bar {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .splash-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
      animation: splashProgress 1.2s ease-in-out infinite;
    }
    @keyframes splashProgress {
      0% { width: 0%; transform: translateX(-100%); }
      50% { width: 70%; transform: translateX(30%); }
      100% { width: 100%; transform: translateX(100%); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-splash">
      <div class="splash-logo-box">
        <div class="splash-spinner"></div>
        <img src="/sarmalticaretlogo.jpg" alt="Sarmal Ticaret" class="splash-img" />
      </div>
      <div class="splash-title">Sarmal Ticaret</div>
      <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 500;">Güvenli Alışveriş Yükleniyor...</div>
      <div class="splash-bar">
        <div class="splash-bar-inner"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/entry-client.jsx"></script>
</body>

</html>
